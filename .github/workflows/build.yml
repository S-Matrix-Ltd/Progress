name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name progress

      - name: Update Kotlin version
        run: sed -i -E "/org.jetbrains.kotlin.android/ s/version [\"'][^\"']*[\"']/version '1.9.24'/" android/settings.gradle

      - name: Bump compileSdk/targetSdk to 35 (local_auth requirement) + force clean SDK reinstall
        run: |
          sed -i -E 's/(compileSdk(Version)?)[[:space:]]+.*/\1 35/' android/app/build.gradle
          sed -i -E 's/(targetSdk(Version)?)[[:space:]]+.*/\1 35/' android/app/build.gradle
          sed -i -E '/compileSdk(Version)? 35/a\    buildToolsVersion "35.0.0"' android/app/build.gradle
          # GitHub-hosted runner-er preinstalled android-35 platform maje-maje
          # corrupted thake (aapt2 "RES_TABLE_TYPE_TYPE entry offsets overlap"
          # error dey) — tai age uninstall kore fresh kore reinstall kora
          # hocche, jate corrupted cache use na hoy.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          rm -rf "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0"
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" --channel=0
          echo "Reinstalled platform + build-tools 35."

      - name: Set app display name to "Progress"
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Progress"/' android/app/src/main/AndroidManifest.xml

      - name: Add browser <queries> for url_launcher (Android 11+ package visibility)
        run: |
          sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Add notification + biometric permissions to manifest
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET"/>#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>#' android/app/src/main/AndroidManifest.xml

      - name: Switch MainActivity to FlutterFragmentActivity (local_auth requirement)
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main -name "MainActivity.kt")
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$MAIN_ACTIVITY"
          echo "Patched: $MAIN_ACTIVITY"
          cat "$MAIN_ACTIVITY"

      - name: Switch app theme to Theme.AppCompat (local_auth requirement)
        run: |
          for f in android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml; do
            if [ -f "$f" ]; then
              sed -i 's#@android:style/Theme.Light.NoTitleBar#@style/Theme.AppCompat.Light.NoActionBar#g; s#@android:style/Theme.Black.NoTitleBar#@style/Theme.AppCompat.NoActionBar#g' "$f"
            fi
          done

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/progress-release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=progress-release.keystore
          EOF

      - name: Wire release signing into build.gradle (permanent-fix for install conflicts)
        run: |
          python3 - <<'PYEOF'
          import re
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # key.properties load korার loader code + signingConfigs{} block
          # — dutoi 'android {' block-er thik age/pore bosanor jonne ekshathe
          # inject kora hocche. NOTE: file-er top-e (plugins{} block-er age)
          # kono statement bosano jabe na — Gradle-er plugins{} DSL rule
          # onujayi shudhu buildscript{}/pluginManagement{}/plugins{} blocks
          # allowed thake tar age. Tai loader-ke 'android {' block-er thik
          # age boshiye eita avoid kora hocche.
          loader = (
              'def keystorePropertiesFile = rootProject.file("key.properties")\n'
              'def keystoreProperties = new Properties()\n'
              'if (keystorePropertiesFile.exists()) {\n'
              '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
              '}\n\n'
          )
          signing_block = (
              '\n    signingConfigs {\n'
              '        release {\n'
              '            keyAlias keystoreProperties["keyAlias"]\n'
              '            keyPassword keystoreProperties["keyPassword"]\n'
              '            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\n'
              '            storePassword keystoreProperties["storePassword"]\n'
              '        }\n'
              '    }\n'
          )
          if 'keystorePropertiesFile' not in content:
              content = re.sub(r'(android\s*\{)', loader + r'\1' + signing_block, content, count=1)

          # buildTypes.release-er signingConfig-ke debug theke release-e switch koro
          # (AGP version bhede '=' shoho/chara duitai handle kora hocche).
          content = re.sub(r'signingConfig\s*=?\s*signingConfigs\.debug', 'signingConfig signingConfigs.release', content)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("build.gradle patched for release signing.")
          PYEOF

      - run: flutter pub get

      - name: Build APK (version-embedded)
        run: flutter build apk --release --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Progress-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
