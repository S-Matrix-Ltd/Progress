name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name progress

      # 2 alada error dekhaচ্ছিল:
      #  1) "failed to load include path .../platforms/android-35/android.jar"
      #     — Flutter 3.24's own template now requires compileSdk/targetSdk 35,
      #     kintu GitHub-er ubuntu-latest runner-e shudhu android-34 porjonto
      #     pre-installed thake — android-35 platform explicitly sdkmanager
      #     diye install korte hoy, nahole Gradle eta khuje na peye fail kore.
      #  2) "project requires a newer version of the Kotlin Gradle plugin"
      #     — compileSdk 35 + notun AGP-er shathe Kotlin 1.9.24 ar match kore
      #     na, tai 2.0.20-e bump kora hocche (AGP 8.x + compileSdk 35-er
      #     shathe compatible, widely-used stable version).
      - name: Install Android SDK Platform 35 + Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # Kotlin bump-er por notun error ashlo: "Android Gradle Plugin version
      # (7.3.0) is lower than the minimum supported 7.3.1" — mane eibar
      # dhora porlo je eই project-er AGP version-o onek purono (7.3.0),
      # Kotlin 2.1.0-er minimum requirement (7.3.1)-er thekeo ekটু kom!
      # Tai ekhane AGP-ke 8.6.0-e bump kora hocche (compileSdk 35, Kotlin
      # 2.1.0 — dutor shathei compatible), ar shathe gradle-wrapper-er
      # Gradle version-o 8.7-e bump kora hocche, karon AGP 8.6 chalate
      # Gradle 8.7+ lagbe — nahole eta ekটা notun mismatch error dibe.
      - name: Update Kotlin + AGP + Gradle wrapper versions
        run: |
          echo "--- settings.gradle BEFORE ---"
          cat android/settings.gradle
          python3 - <<'PYEOF'
          import re
          path = "android/settings.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # Age-r sed-based approach ('s/version ["\']...' pattern) file-e
          # match kore nai bole silently kichu change hocchilo na, tai
          # eki error bar bar ashচ্ছিল. Python-er regex diye ekhon shudhu
          # "org.jetbrains.kotlin.android" line-tar version-ke shorasori
          # target kore replace kora hocche, jate guaranteed kaj kore.
          kotlin_pattern = re.compile(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+)["\'][^"\']*["\']'
          )
          content, n1 = kotlin_pattern.subn(r"\1'2.1.0'", content)
          if n1 == 0:
              raise SystemExit("Could not find org.jetbrains.kotlin.android plugin line to patch — aborting build.")

          agp_pattern = re.compile(
              r'(id\s+["\']com\.android\.application["\']\s+version\s+)["\'][^"\']*["\']'
          )
          content, n2 = agp_pattern.subn(r"\1'8.6.0'", content)
          if n2 == 0:
              raise SystemExit("Could not find com.android.application plugin line to patch — aborting build.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print(f"Patched kotlin.android -> 2.1.0 ({n1}), com.android.application -> 8.6.0 ({n2})")
          PYEOF
          echo "--- settings.gradle AFTER ---"
          cat android/settings.gradle

          echo "--- gradle-wrapper.properties BEFORE ---"
          cat android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle-wrapper.properties AFTER ---"
          cat android/gradle/wrapper/gradle-wrapper.properties


      - name: Set app display name to "Progress"
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Progress"/' android/app/src/main/AndroidManifest.xml

      - name: Add browser <queries> for url_launcher (Android 11+ package visibility)
        run: |
          sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml

      # IMPORTANT: the old version of this step did a sed find/replace that
      # looked for an EXISTING <uses-permission INTERNET> line and inserted
      # the new permissions right after it. But `flutter create` does NOT
      # put an INTERNET permission in the RELEASE manifest at all (it only
      # exists in the debug-only manifest, which is not part of a release
      # build) — so that find/replace silently matched nothing and NONE of
      # these permissions were ever added to the real APK. This is why the
      # release build had no internet access (update-check "network error")
      # and no notification permission (alarm/reminder silently failing).
      # Fixed by inserting permissions right after the <manifest ...> open
      # tag directly, which always exists.
      - name: Add internet, notification, biometric, boot permissions to manifest
        run: |
          python3 - <<'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n'
              '    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
          )
          # Insert right after the opening <manifest ...> tag, regardless of
          # whatever permissions (if any) already exist in the file.
          content, n = re.subn(r'(<manifest[^>]*>)', r'\1\n' + perms, content, count=1)
          if n == 0:
              raise SystemExit("Could not find <manifest> tag to patch — aborting build.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("AndroidManifest.xml patched with required permissions.")
          PYEOF

      - name: Switch MainActivity to FlutterFragmentActivity (local_auth requirement)
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main -name "MainActivity.kt")
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$MAIN_ACTIVITY"
          echo "Patched: $MAIN_ACTIVITY"
          cat "$MAIN_ACTIVITY"

      - name: Switch app theme to Theme.AppCompat (local_auth requirement)
        run: |
          for f in android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml; do
            if [ -f "$f" ]; then
              sed -i 's#@android:style/Theme.Light.NoTitleBar#@style/Theme.AppCompat.Light.NoActionBar#g; s#@android:style/Theme.Black.NoTitleBar#@style/Theme.AppCompat.NoActionBar#g' "$f"
            fi
          done

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/progress-release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=progress-release.keystore
          EOF

      - name: Wire release signing into build.gradle (permanent-fix for install conflicts)
        run: |
          python3 - <<'PYEOF'
          import re
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # key.properties load korার loader code + signingConfigs{} block
          # — dutoi 'android {' block-er thik age/pore bosanor jonne ekshathe
          # inject kora hocche. NOTE: file-er top-e (plugins{} block-er age)
          # kono statement bosano jabe na — Gradle-er plugins{} DSL rule
          # onujayi shudhu buildscript{}/pluginManagement{}/plugins{} blocks
          # allowed thake tar age. Tai loader-ke 'android {' block-er thik
          # age boshiye eita avoid kora hocche.
          loader = (
              'def keystorePropertiesFile = rootProject.file("key.properties")\n'
              'def keystoreProperties = new Properties()\n'
              'if (keystorePropertiesFile.exists()) {\n'
              '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
              '}\n\n'
          )
          signing_block = (
              '\n    signingConfigs {\n'
              '        release {\n'
              '            keyAlias keystoreProperties["keyAlias"]\n'
              '            keyPassword keystoreProperties["keyPassword"]\n'
              '            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\n'
              '            storePassword keystoreProperties["storePassword"]\n'
              '        }\n'
              '    }\n'
          )
          if 'keystorePropertiesFile' not in content:
              content = re.sub(r'(android\s*\{)', loader + r'\1' + signing_block, content, count=1)

          # buildTypes.release-er signingConfig-ke debug theke release-e switch koro
          # (AGP version bhede '=' shoho/chara duitai handle kora hocche).
          content = re.sub(r'signingConfig\s*=?\s*signingConfigs\.debug', 'signingConfig signingConfigs.release', content)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("build.gradle patched for release signing.")
          PYEOF

      - run: flutter pub get

      - name: Build APK (version-embedded)
        run: flutter build apk --release --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Progress-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
