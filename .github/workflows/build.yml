name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name progress

      - name: Update Kotlin version
        run: sed -i "s/org.jetbrains.kotlin.android') version '.*'/org.jetbrains.kotlin.android') version '1.9.24'/" android/settings.gradle

      - name: Set app display name to "Progress"
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Progress"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Progress-apk
          path: build/app/outputs/flutter-apk/app-release.apk
